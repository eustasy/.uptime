assignees:
  - lewisgoddard

status-website:
  cname: status.eustasy.org
  logoUrl: https://eustasy.org/assets/favicon.svg
  name: eustasy Status
  introTitle: "Status of **eustasy** sites and services"
  introMessage: Checked hourly with [Upptime](https://upptime.js.org). Downtime is tracked as issues in the [GitHub repository](https://github.com/eustasy/.uptime).
  navbar:
    - title: Status
      href: /
    - title: eustasy.org
      href: https://eustasy.org
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Configuration reference: https://upptime.js.org/docs/configuration

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "15 * * * *"
